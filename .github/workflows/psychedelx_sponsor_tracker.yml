name: PsychedelX Sponsor Tracker Sync

on:
  schedule:
    # 8:00 AM America/New_York (EDT) == 12:00 UTC in May.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      debug_rfc822msgids:
        description: "Comma-separated RFC 822 Message-IDs to debug (include <>). Optional."
        required: false
        type: string

concurrency:
  group: psychedelx-sponsor-tracker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Opt into Node.js 24 for JavaScript-based actions ahead of runner default changes.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: automations/psychedelx-sponsor-tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        working-directory: automations/psychedelx-sponsor-tracker
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_USER_EMAIL: ${{ secrets.GOOGLE_USER_EMAIL }}
          TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID }}
          TRACKER_TAB_NAME: ${{ secrets.TRACKER_TAB_NAME }}
          AUDIT_TAB_NAME: ${{ secrets.AUDIT_TAB_NAME }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          DEBUG_RFC822MSGIDS: ${{ inputs.debug_rfc822msgids }}
        run: |
          PYTHONPATH=src python scripts/run_sync.py
